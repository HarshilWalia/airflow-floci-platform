
services:
  floci:
    image: floci/floci:latest
    container_name: floci
    restart: unless-stopped

    ports:
      - "127.0.0.1:4566:4566"

    volumes:
      # Docker socket: allows Floci to launch other containers
      - "${HOME}/.docker/run/docker.sock:/var/run/docker.sock"

      # Persist Floci state on the host
      - "./data:/app/data"

    environment:
      FLOCI_RUN_AS_ROOT: "true"
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566

      FLOCI_SERVICES_DOCKER_NETWORK: airflow-platform

    networks:
      - floci-network

networks:
  floci-network:
    name: airflow-platform
